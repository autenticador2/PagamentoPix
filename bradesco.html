<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token de Autenticação - Bradesco</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; max-width: 400px; width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
        
        /* CABEÇALHO COM A LOGO */
        .header { background-color: #cc092f; color: white; padding: 25px; text-align: center; border-bottom: 4px solid #b3082a; }
        .logo { width: 140px; height: auto; display: block; margin: 0 auto 12px auto; }
        .subtitle { font-size: 11px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }

        .content { padding: 35px 30px; }
        
        /* TEXTO ALTERADO CONFORME SOLICITADO */
        .status { color: #28a745; font-weight: bold; margin-bottom: 30px; font-size: 18px; }
        
        .token-label { font-size: 12px; color: #999; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        
        .token-box { border: 2px dashed #cc092f; border-radius: 8px; padding: 20px; margin-bottom: 30px; background: #fff5f5; }
        .token-number { font-size: 42px; font-weight: bold; color: #333; letter-spacing: 8px; }
        
        .footer-note { font-size: 13px; color: #555; background: #f9f9f9; padding: 15px; border-radius: 8px; line-height: 1.4; }
        .copyright { font-size: 10px; color: #ccc; margin-top: 25px; padding-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <img src="Bazaart_20260329_030551_091.png" alt="Bradesco" class="logo">
        <div class="subtitle">Internet Banking - Autenticação</div>
    </div>

    <div class="content">
        <div class="status">Aparelho Autenticado com Sucesso</div>
        
        <div class="token-label">Token de Autenticação Gerado:</div>
        <div class="token-box">
            <div class="token-number" id="token">----</div>
        </div>

        <div class="footer-note">
            <b>Importante:</b> Informe este token de 4 dígitos ao pagador para a liberação imediata do valor de recebimento via PIX.
        </div>

        <div class="copyright">Bradesco S.A. - 2024</div>
    </div>
</div>

<script>
    // Mantendo a lógica de gerar o token automaticamente
    function gerarToken() {
        const token = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('token').innerText = token;
    }
    window.onload = gerarToken;
</script>

</body>
</html>
